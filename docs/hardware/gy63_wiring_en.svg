<line x1="754" y1="328" x2="766" y2="316" stroke="#c0141b" stroke-width="2.5"/>
<line x1="754" y1="354" x2="766" y2="366" stroke="#c0141b" stroke-width="2.5"/>
<line x1="754" y1="366" x2="766" y2="354" stroke="#c0141b" stroke-width="2.5"/>
<line x1="754" y1="392" x2="766" y2="404" stroke="#c0141b" stroke-width="2.5"/>
<line x1="754" y1="404" x2="766" y2="392" stroke="#c0141b" stroke-width="2.5"/>
<text x="746" y="365" font-size="12" text-anchor="end" fill="#c0141b">leave unconnected</text>
<path d="M900,170 H940" stroke="#d62728" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<path d="M900,208 H940" stroke="#222" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<line x1="940" y1="170" x2="940" y2="184.0" stroke="#555" stroke-width="2"/>
<line x1="940" y1="194.0" x2="940" y2="208" stroke="#555" stroke-width="2"/>
<line x1="928" y1="184.0" x2="952" y2="184.0" stroke="#555" stroke-width="3"/>
<line x1="928" y1="194.0" x2="952" y2="194.0" stroke="#555" stroke-width="3"/>
<text x="960" y="177.0" font-size="11" fill="#555">optional</text>
<text x="960" y="191.0" font-size="11" fill="#555">10 µF + 100 nF</text>
<text x="960" y="205.0" font-size="11" fill="#555">VCC – GND</text>
<text x="835.0" y="452" font-size="11" text-anchor="middle" fill="#123270">PS: pulled up to VCC on the module = I²C mode</text>
<text x="835.0" y="467" font-size="11" text-anchor="middle" fill="#123270">CSB: address 0x77 / 0x76 – firmware detects both</text>
<rect x="30" y="520" width="1040" height="150" rx="8" fill="#f6f7f9" stroke="#d5d8de"/>
<text x="55" y="544" font-size="12" font-weight="bold" fill="#333">JST-SH pin</text>
<text x="300" y="544" font-size="12" font-weight="bold" fill="#333">T5 S3 Pro</text>
<text x="470" y="544" font-size="12" font-weight="bold" fill="#333">GY-63</text>
<text x="75" y="566" font-size="12" fill="#222">1</text>
<rect x="110" y="557" width="60" height="9" rx="4" fill="#222222"/>
<text x="300" y="566" font-size="12" fill="#222">GND</text>
<text x="470" y="566" font-size="12" font-weight="bold" fill="#222">GND</text>
<text x="75" y="586" font-size="12" fill="#222">2</text>
<rect x="110" y="577" width="60" height="9" rx="4" fill="#d62728"/>
<text x="300" y="586" font-size="12" fill="#222">3V3 (3.3 V)</text>
<text x="470" y="586" font-size="12" font-weight="bold" fill="#222">VCC</text>
<text x="75" y="606" font-size="12" fill="#222">3</text>
<rect x="110" y="597" width="60" height="9" rx="4" fill="#1f6fd1"/>
<text x="300" y="606" font-size="12" fill="#222">SDA (GPIO39)</text>
<text x="470" y="606" font-size="12" font-weight="bold" fill="#222">SDA</text>
<text x="75" y="626" font-size="12" fill="#222">4</text>
<rect x="110" y="617" width="60" height="9" rx="4" fill="#e8c21a"/>
<text x="300" y="626" font-size="12" fill="#222">SCL (GPIO40)</text>
<text x="470" y="626" font-size="12" font-weight="bold" fill="#222">SCL</text>
<line x1="580" y1="532" x2="580" y2="658" stroke="#d5d8de"/>
<text x="600" y="544" font-size="11" fill="#333">• The colours are the QWIIC standard – a cheap cable may differ:</text>
<text x="610" y="559" font-size="11" fill="#333">check with a meter which plug pin is which wire.</text>
<text x="600" y="577" font-size="11" fill="#333">• Socket pin 1 (GND) is marked on the board; the plug fits only</text>
<text x="610" y="592" font-size="11" fill="#333">one way.</text>
<text x="600" y="610" font-size="11" fill="#333">• Keep the cable short (5–10 cm) and away from the display ribbon</text>
<text x="610" y="625" font-size="11" fill="#333">– a full e-paper refresh disturbs a long cable.</text>
<text x="600" y="643" font-size="11" fill="#333">• 3.3 V supply from the QWIIC socket – never connect 5 V. Cover</text>
<text x="610" y="658" font-size="11" fill="#333">the sensor with foam (it is sensitive to light).</text>
</svg>