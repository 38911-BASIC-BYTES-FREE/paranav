<text x="550.0" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#111">Connecting the GY-63 (MS5611) barometer to the LilyGO T5 E-Paper S3 Pro</text>
<text x="550.0" y="58" font-size="13" text-anchor="middle" fill="#555">JST-SH 4-pin cable (QWIIC / STEMMA QT), 1.0 mm pitch – plug into the board, other end soldered to the module</text>
