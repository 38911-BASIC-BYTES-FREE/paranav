; ParaNav - paramotor flight computer
; LilyGO T5 E-Paper S3 Pro (H752) + MS5611 (QWIIC)
;
; Build:    pio run
; Upload:   pio run -t upload        (if the port does not appear: hold BOOT, press RST, release BOOT)
; Monitor:  pio device monitor

[platformio]
default_envs = t5s3pro
boards_dir = boards

[env:t5s3pro]
platform = espressif32@6.5.0          ; = arduino-esp32 2.0.14, same version as the LilyGO examples
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; NimBLE: 2 connections (BlueFly + phone), no observer-only extras, host memory in PSRAM
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
lib_ldf_mode = deep+
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3     ; Bluetooth LE (BlueFlyVario)
