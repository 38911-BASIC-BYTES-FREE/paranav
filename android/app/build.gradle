plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.paranav.uploader'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.paranav.uploader'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.5.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so the APK installs directly (private use, not for Google Play)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: plain Android framework only.
