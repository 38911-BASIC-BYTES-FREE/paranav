# Builds a background map for the TOPO screen on GitHub's servers (nothing to install on your PC).
# GitHub -> "Actions" -> "Zbuduj mapę" -> "Run workflow" -> fill in the form -> wait (~10-30 min)
# -> open the finished run -> download the "mapa-<name>" artifact (zip) -> unpack -> copy the
# "maps" folder to the root of the SD card (card reader or ParaNav "Tryb USB").
# Map data: (c) OpenStreetMap contributors, ODbL, downloaded from download.geofabrik.de.
name: Zbuduj mapę
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nazwa obszaru (folder na karcie: a-z, 0-9, _)'
        default: 'gdansk'
        required: true
      title:
        description: 'Opis widoczny na urządzeniu'
        default: 'Gdańsk 100 km'
        required: true
      center:
        description: 'Środek: szerokość,długość (stopnie)'
        default: '54.35,18.65'
        required: true
      radius_km:
        description: 'Promień w km'
        default: '100'
        required: true
      zooms:
        description: 'Poziomy mapy (10 = przegląd ... 14 = szczegóły)'
        default: '10-14'
        required: true
      regions:
        description: 'Pliki Geofabrik bez "-latest.osm.pbf", oddzielone przecinkami (muszą pokryć cały obszar!)'
        default: 'europe/poland/pomorskie,europe/poland/kujawsko-pomorskie,europe/poland/warminsko-mazurskie,russia/kaliningrad'
        required: true
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install -r tools/topo/requirements.txt
      - name: Download OSM data
        run: |
          mkdir -p osm
          IFS=',' read -ra R <<< "${{ inputs.regions }}"
          for r in "${R[@]}"; do
            r="$(echo "$r" | xargs)"
            f="osm/$(basename "$r").osm.pbf"
            echo "== $r"
            curl -fL --retry 3 -o "$f" "https://download.geofabrik.de/$r-latest.osm.pbf"
            ls -l "$f"
          done
      - name: Render tiles
        run: |
          ARGS=""
          for f in osm/*.osm.pbf; do ARGS="$ARGS --pbf $f"; done
          python3 tools/topo/make_tiles.py $ARGS \
            --name "${{ inputs.name }}" --title "${{ inputs.title }}" \
            --center "${{ inputs.center }}" --radius-km "${{ inputs.radius_km }}" \
            --zooms "${{ inputs.zooms }}" --osm-date "$(date +%Y-%m-%d)" \
            --out out --preview
          cp tools/topo/CZYTAJ_mapy.txt out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-${{ inputs.name }}
          path: out/
          retention-days: 30
