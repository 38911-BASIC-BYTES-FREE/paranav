# Builds a background map for the TOPO screen on GitHub's servers (nothing to install on your PC).
# GitHub -> "Actions" -> "Build map" -> "Run workflow" -> fill in the form -> wait (~10-30 min)
# -> open the finished run -> download the "mapa-<name>" artifact (zip) -> unpack -> copy the
# "maps" folder to the root of the SD card (card reader or ParaNav "Tryb USB").
# Map data: (c) OpenStreetMap contributors, ODbL, downloaded from download.geofabrik.de.
name: Build map
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Area name (folder on the card: a-z, 0-9, _)'
        default: 'gdansk'
        required: true
      title:
        description: 'Description shown on the device'
        default: 'Gdańsk 100 km'
        required: true
      center:
        description: 'Centre: latitude,longitude (degrees)'
        default: '54.35,18.65'
        required: true
      radius_km:
        description: 'Radius in km'
        default: '100'
        required: true
      zooms:
        description: 'Map levels (10 = overview ... 14 = detail)'
        default: '10-14'
        required: true
      regions:
        description: 'Geofabrik files without "-latest.osm.pbf", comma separated (must cover the whole area!)'
        default: 'europe/poland/pomorskie,europe/poland/kujawsko-pomorskie,europe/poland/warminsko-mazurskie,russia/kaliningrad'
        required: true
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install -r tools/topo/requirements.txt
      - name: Download OSM data
        run: |
          mkdir -p osm
          IFS=',' read -ra R <<< "${{ inputs.regions }}"
          # Geofabrik moved sub-region files into sub-folders (europe/poland/pomorskie-latest.osm.pbf ->
          # europe/poland/pomorskie/pomorskie-latest.osm.pbf): try both, then look the region up in the
          # official index (index-v1-nogeom.json, field urls.pbf). "-latest" redirects to the dated file.
          G=https://download.geofabrik.de
          for r in "${R[@]}"; do
            r="$(echo "$r" | xargs)"
            b="$(basename "$r")"
            f="osm/$b.osm.pbf"
            echo "== $r"
            if curl -fL --retry 3 -o "$f" "$G/$r-latest.osm.pbf"; then :
            elif curl -fL --retry 3 -o "$f" "$G/$r/$b-latest.osm.pbf"; then :
            else
              [ -f osm/index.json ] || curl -fsSL --retry 3 -o osm/index.json "$G/index-v1-nogeom.json"
              u="$(python3 - "$b" <<'PY'
          import json, sys
          want = sys.argv[1]
          for ft in json.load(open("osm/index.json"))["features"]:
              p = ft["properties"]
              if p.get("id") == want or p.get("urls", {}).get("pbf", "").endswith("/" + want + "-latest.osm.pbf"):
                  print(p["urls"]["pbf"])
                  break
          PY
              )"
              [ -n "$u" ] || { echo "::error::Region $r not found on download.geofabrik.de"; exit 1; }
              echo "   -> $u"
              curl -fL --retry 3 -o "$f" "$u"
            fi
            ls -l "$f"
          done
      - name: Render tiles
        run: |
          ARGS=""
          for f in osm/*.osm.pbf; do ARGS="$ARGS --pbf $f"; done
          python3 tools/topo/make_tiles.py $ARGS \
            --name "${{ inputs.name }}" --title "${{ inputs.title }}" \
            --center "${{ inputs.center }}" --radius-km "${{ inputs.radius_km }}" \
            --zooms "${{ inputs.zooms }}" --osm-date "$(date +%Y-%m-%d)" \
            --out out --preview
          cp tools/topo/README_maps.txt tools/topo/CZYTAJ_mapy.txt out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: mapa-${{ inputs.name }}
          path: out/
          retention-days: 30
